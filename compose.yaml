name: codeclub-cambridge

services:
  web:
    build:
      context: .
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-local}
    image: codeclub-cambridge:current
    container_name: codeclub-cambridge
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      DEPLOY_SHA: ${DEPLOY_SHA:-local}
      PUBLIC_URL: ${PUBLIC_URL:-https://club-host.exe.xyz}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_ALLOWED_EMAILS: ${AUTH_ALLOWED_EMAILS:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      CONTENT_DATABASE_FILE: /app/data/codeclub.sqlite
      SCHEDULE_DATA_FILE: /app/data/schedule.json
    volumes:
      - schedule-data:/app/data
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb

volumes:
  schedule-data:
