name: codeclub-cambridge

services:
  web:
    build:
      context: .
      args:
        DEPLOY_SHA: ${DEPLOY_SHA:-local}
    image: codeclub-cambridge:current
    container_name: codeclub-cambridge
    restart: unless-stopped
    init: true
    ports:
      - '127.0.0.1:8000:8000'
    environment:
      NODE_ENV: production
      PORT: 8000
      DEPLOY_SHA: ${DEPLOY_SHA:-local}
      SCHEDULE_ADMIN_KEY_HASH: ${SCHEDULE_ADMIN_KEY_HASH:-}
      SCHEDULE_DATA_FILE: /app/data/schedule.json
    volumes:
      - schedule-data:/app/data
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb

volumes:
  schedule-data:
